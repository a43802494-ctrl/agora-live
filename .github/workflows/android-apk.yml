name: Android APK

on:
  push:
    branches:
      - chat-app-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: Android
        run: |
          chmod +x ./gradlew
          # Build-only placeholder: replace with a real Agora App ID before any live RTC/IM testing.
          ./gradlew --no-daemon --stacktrace -PAGORA_APP_ID=00000000000000000000000000000000 :app:assembleDebug

      - name: Prepare APK transfer parts
        shell: bash
        run: |
          APK="$(find Android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/AgoraLive-debug.apk"
          split -b 20m -d --additional-suffix=.part "$RUNNER_TEMP/AgoraLive-debug.apk" "$RUNNER_TEMP/agora-apk-part-"
          printf '%s\n' "AgoraLive-debug.apk" > "$RUNNER_TEMP/APK_NAME.txt"

      - name: Upload APK part 00
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-00
          path: |
            ${{ runner.temp }}/agora-apk-part-00.part
            ${{ runner.temp }}/APK_NAME.txt
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 01
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-01
          path: ${{ runner.temp }}/agora-apk-part-01.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 02
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-02
          path: ${{ runner.temp }}/agora-apk-part-02.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 03
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-03
          path: ${{ runner.temp }}/agora-apk-part-03.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 04
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-04
          path: ${{ runner.temp }}/agora-apk-part-04.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 05
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-05
          path: ${{ runner.temp }}/agora-apk-part-05.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 06
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-06
          path: ${{ runner.temp }}/agora-apk-part-06.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 07
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-07
          path: ${{ runner.temp }}/agora-apk-part-07.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 08
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-08
          path: ${{ runner.temp }}/agora-apk-part-08.part
          if-no-files-found: error
          retention-days: 2

      - name: Upload APK part 09
        uses: actions/upload-artifact@v4
        with:
          name: agora-apk-part-09
          path: ${{ runner.temp }}/agora-apk-part-09.part
          if-no-files-found: error
          retention-days: 2
